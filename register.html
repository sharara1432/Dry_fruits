<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Sheern Premium Dry Fruit</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================= BOOTSTRAP ICONS ================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ================= GOOGLE FONTS ================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <!-- ================= REGISTER CSS ================= -->

    <link
        rel="stylesheet"
        href="CSS/register.css">

</head>


<body>


<main class="register-page">


    <!-- =====================================================
         DECORATIVE BACKGROUND
    ====================================================== -->

    <div class="decor decor-one">

        <img
            src="Photos/pistacho.jpg"
            alt="Pistachios">

    </div>


    <div class="decor decor-two">

        <img
            src="Photos/cashew.jpg"
            alt="Cashews">

    </div>


    <div class="decor decor-three">

        <img
            src="Photos/almond.jpg"
            alt="Almonds">

    </div>


    <div class="decor decor-four">

        <img
            src="Photos/MIX.jpg"
            alt="Dry Fruits">

    </div>



    <!-- =====================================================
         BRAND
    ====================================================== -->

    <a
        href="index.html"
        class="top-brand">

        <img
            src="Photos/Logo.png"
            alt="Sheern Logo">


        <div class="brand-text">

            <h1>Sheern</h1>

            <span>PREMIUM DRY FRUIT</span>

        </div>

    </a>



    <!-- =====================================================
         LEFT INFORMATION
    ====================================================== -->

    <section class="side-title">

        <span>JOIN THE FAMILY</span>

        <h2>Pure<br>Choices.</h2>

        <p>
            Create your Sheern account
            and discover premium quality
            dry fruits.
        </p>

    </section>



    <!-- =====================================================
         REGISTER CARD
    ====================================================== -->

    <section class="register-card">


        <!-- ================= LOGO ================= -->

        <div class="register-logo">

            <img
                src="Photos/Logo.png"
                alt="Sheern Premium Dry Fruit">

        </div>



        <!-- ================= HEADING ================= -->

        <div class="register-heading">

            <h2>Create Account</h2>

            <p>Join Sheern for a healthier lifestyle</p>

        </div>



        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form id="registerForm">


            <!-- ================= FULL NAME ================= -->

            <div class="input-group-custom">

                <label for="fullName">
                    Full Name
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>

                </div>

            </div>



            <!-- ================= USERNAME ================= -->

            <div class="input-group-custom">

                <label for="username">
                    Username
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-person-badge"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required>

                </div>

            </div>



            <!-- ================= EMAIL ================= -->

            <div class="input-group-custom">

                <label for="email">
                    Email Address
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required>

                </div>

            </div>



            <!-- ================= PASSWORD ================= -->

            <div class="input-group-custom">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>


                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-button">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>



            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="input-group-custom">

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-shield-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>


                    <button
                        type="button"
                        id="confirmPasswordToggle"
                        class="password-button">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>



            <!-- ================= TERMS ================= -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </span>

            </label>



            <!-- ================= MESSAGE ================= -->

            <div
                id="registerMessage"
                class="register-message">
            </div>



            <!-- ================= REGISTER BUTTON ================= -->

            <button
                type="submit"
                class="register-button">

                <span>Create Account</span>

                <i class="bi bi-arrow-right"></i>

            </button>


        </form>



        <!-- =================================================
             LOGIN
        ================================================== -->

        <div class="already-account">

            <span>
                Already have an account?
            </span>


            <a href="login.html">
                Login
            </a>

        </div>



        <!-- =================================================
             BACK HOME
        ================================================== -->

        <div class="back-home">

            <a href="index.html">

                <i class="bi bi-arrow-left"></i>

                Back to website

            </a>

        </div>


    </section>



    <!-- ================= FOOTER ================= -->

    <footer class="page-footer">

        © 2026 Sheern Premium Dry Fruit

    </footer>


</main>



<!-- ================= REGISTER JS ================= -->

<script src="JS/register.js"></script>


</body>

</html>
