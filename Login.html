<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sheern Premium Dry Fruit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>
    <main class="login-page">
        <div class="decor decor-one"><img src="Photos/pistacho.jpg" alt="Pistachios"></div>
        <div class="decor decor-two"><img src="Photos/cashew.jpg" alt="Cashews"></div>
        <div class="decor decor-three"><img src="Photos/almond.jpg" alt="Almonds"></div>
        <div class="decor decor-four"><img src="Photos/MIX.jpg" alt="Mixed Dry Fruits"></div>

        <a href="index.html" class="top-brand">
            <img src="Photos/Logo.png" alt="Sheern Logo">
            <div class="brand-text">
                <h1>Sheern</h1><span>PREMIUM DRY FRUIT</span>
            </div>
        </a>

        <section class="side-title">
            <span>WELCOME TO</span>
            <h2>Sheern</h2>
            <p>Premium quality dry fruits,<br>naturally selected for you.</p>
        </section>

        <section class="login-card">
            <div class="login-logo"><img src="Photos/Logo.png" alt="Sheern Premium Dry Fruit"></div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Login to your account</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="input-group-custom">
                    <label for="username">Email or Username</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person"></i>
                        <input type="text" id="username" placeholder="Enter your email or username"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" id="passwordToggle" class="password-button" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe"><span>Remember me</span>
                    </label>
                    <!-- CHANGED: opens the forgot password modal -->
                    <a href="#" id="forgotPassword" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot Password?</a>
                </div>

                <div id="loginMessage" class="login-message"></div>

                <button type="submit" class="login-button">Login</button>
            </form>

            <div class="social-divider"><span>or continue with</span></div>

            <div class="social-login">
                <button type="button" aria-label="Login with Google"><i class="bi bi-google"></i></button>
                <button type="button" aria-label="Login with Facebook"><i class="bi bi-facebook"></i></button>
                <button type="button" aria-label="Login with X"><i class="bi bi-twitter-x"></i></button>
            </div>

            <div class="create-account">
                <span>Don't have an account?</span>
                <a href="register.html">Create Account</a>
            </div>

            <div class="back-home">
                <a href="index.html"><i class="bi bi-arrow-left"></i> Back to website</a>
            </div>
        </section>

        <footer class="page-footer">&copy; 2026 Sheern Premium Dry Fruit</footer>
    </main>

    <!-- NEW: Forgot Password Modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h5 class="modal-title">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="fpMsg" class="small"></p>

                    <!-- Step 1: email -->
                    <div id="step1">
                        <input type="email" id="fpEmail" class="form-control mb-3" placeholder="Registered email">
                        <button type="button" class="btn btn-warning w-100" onclick="sendOtp()">Send OTP</button>
                    </div>

                    <!-- Step 2: OTP -->
                    <div id="step2" class="d-none">
                        <input type="text" id="fpOtp" maxlength="6" class="form-control mb-3"
                            placeholder="Enter 6-digit OTP">
                        <button type="button" class="btn btn-warning w-100 mb-2" onclick="verifyOtp()">Verify OTP</button>
                        <button type="button" class="btn btn-link w-100" onclick="sendOtp()">Resend OTP</button>
                    </div>

                    <!-- Step 3: new password -->
                    <div id="step3" class="d-none">
                        <input type="password" id="fpNew" class="form-control mb-2" placeholder="New password">
                        <input type="password" id="fpConfirm" class="form-control mb-3" placeholder="Confirm password">
                        <button type="button" class="btn btn-success w-100" onclick="resetPassword()">Save New Password</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHANGED: added Bootstrap JS + EmailJS + ForgotPassword.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/login.js"></script>
    <script src="JS/ForgotPassword.js"></script>
</body>

</html>
