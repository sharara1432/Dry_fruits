<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sheern Premium Dry Fruit</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Login CSS -->
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

    <main class="login-page">

        <!-- Decorative dry-fruit images -->
        <div class="decor decor-one">
            <img src="Photos/pistacho.jpg" alt="Pistachios">
        </div>

        <div class="decor decor-two">
            <img src="Photos/cashew.jpg" alt="Cashews">
        </div>

        <div class="decor decor-three">
            <img src="Photos/almond.jpg" alt="Almonds">
        </div>

        <div class="decor decor-four">
            <img src="Photos/MIX.jpg" alt="Mixed Dry Fruits">
        </div>

        <!-- Brand -->
        <a href="index.html" class="top-brand">
            <img src="Photos/Logo.png" alt="Sheern Logo">

            <div class="brand-text">
                <h1>Sheern</h1>
                <span>PREMIUM DRY FRUIT</span>
            </div>
        </a>

        <!-- Left introduction -->
        <section class="side-title">
            <span>WELCOME TO</span>
            <h2>Sheern</h2>
            <p>
                Premium quality dry fruits,<br>
                naturally selected for you.
            </p>
        </section>

        <!-- Login card -->
        <section class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <img src="Photos/Logo.png" alt="Sheern Premium Dry Fruit">
            </div>

            <!-- Heading -->
            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Login to your account</p>
            </div>

            <!-- User type -->
            <div class="role-title">Login as</div>

            <div class="role-selection">

                <label class="role-option">
                    <input type="radio" name="userRole" value="customer" checked>

                    <span class="radio-circle"></span>
                    <span class="role-name">Customer</span>
                </label>

                <label class="role-option">
                    <input type="radio" name="userRole" value="admin">

                    <span class="radio-circle"></span>
                    <span class="role-name">Admin</span>
                </label>

            </div>

            <!-- Login form -->
            <form id="loginForm">

                <div class="input-group-custom">
                    <label for="username">Email or Username</label>

                    <div class="input-wrapper">
                        <i class="bi bi-person"></i>

                        <input type="text" id="username" placeholder="Enter your email or username" required>
                    </div>
                </div>

                <div class="input-group-custom">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>

                        <input type="password" id="password" placeholder="Enter your password" required>

                        <button type="button" id="passwordToggle" class="password-button" aria-label="Show password">

                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>
                </div>

                <div id="loginMessage" class="login-message"></div>

                <button type="submit" class="login-button">
                    <span>Login</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <!-- Social login -->
            <div class="social-divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button type="button" aria-label="Login with Google">
                    <i class="bi bi-google"></i>
                </button>

                <button type="button" aria-label="Login with Facebook">
                    <i class="bi bi-facebook"></i>
                </button>

                <button type="button" aria-label="Login with X">
                    <i class="bi bi-twitter-x"></i>
                </button>
            </div>

            <!-- Register -->
            <div class="create-account">
                <span>Don't have an account?</span>
                <a href="register.html">Create Account</a>
            </div>

            <!-- Back -->
            <div class="back-home">
                <a href="index.html">
                    <i class="bi bi-arrow-left"></i>
                    Back to website
                </a>
            </div>

        </section>

        <footer class="page-footer">
            © 2026 Sheern Premium Dry Fruit
        </footer>

    </main>

   
    <script src="JS/login.js"></script>

</body>

</html>
